<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>層雲峡 場所ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: one spot per page, read top to bottom — seasonal photo, voice, text, other spots strip, map. The season sets the accent color. */
:root{
  --bg:#f2f1ec; --surface:#fbfbf8; --sunk:#e7e6df; --ink:#20251f; --muted:#5f665c; --line:#d6d5cb;
  --spring:#7d4f93; --summer:#3c6b45; --autumn:#b0442b; --winter:#3f6f8c;
  --season:var(--autumn); --on-season:#fff; --me:#1f6fe5;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141714; --surface:#1c201c; --sunk:#252a25; --ink:#e9e8df; --muted:#a2a99d; --line:#333932;
  --spring:#c39ad6; --summer:#8fc597; --autumn:#ec8a6c; --winter:#8fc0dc; --on-season:#141714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141714; --surface:#1c201c; --sunk:#252a25; --ink:#e9e8df; --muted:#a2a99d; --line:#333932;
  --spring:#c39ad6; --summer:#8fc597; --autumn:#ec8a6c; --winter:#8fc0dc; --on-season:#141714; color-scheme:dark}
body[data-season="spring"]{--season:var(--spring)} body[data-season="summer"]{--season:var(--summer)}
body[data-season="autumn"]{--season:var(--autumn)} body[data-season="winter"]{--season:var(--winter)}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
a{color:inherit}
button{font-family:var(--body);color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--season);outline-offset:2px}
.page{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:0 40px;display:flex;flex-direction:column;gap:28px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:500;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar nav{flex:none;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{white-space:nowrap;border:0;background:transparent;padding:4px 10px;font-size:.78rem;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
@media (max-width:360px){#count{display:none}}
.iconbtn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.8rem;cursor:pointer;text-decoration:none}

/* hero photo */
.hero{display:flex;flex-direction:column;gap:10px;margin-top:-12px}
.photo{position:relative;aspect-ratio:4/3;width:calc(100% + 32px);max-width:none;border-radius:0 0 14px 14px;overflow:hidden;margin-inline:-16px;background:var(--sunk)}
@media (min-width:652px){.photo{width:100%;margin-inline:0;border-radius:14px}}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--season);
  background:
    repeating-linear-gradient(90deg,transparent 0 22px,color-mix(in srgb,var(--season) 9%,transparent) 22px 24px),
    linear-gradient(160deg,color-mix(in srgb,var(--season) 16%,var(--sunk)),var(--sunk))}
.ph b{font-family:var(--display);font-size:5rem;line-height:1;font-weight:800}
.ph span{font-size:.82rem;color:var(--muted)}
.seasons{display:flex;gap:6px}
.seasons button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 0;font-size:.85rem;cursor:pointer}
.seasons button[aria-pressed="true"]{background:var(--season);border-color:var(--season);color:var(--on-season);font-weight:700}

/* title */
.eyebrow{font-size:.75rem;letter-spacing:.12em;color:var(--season);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.2;margin:2px 0 6px;text-wrap:balance}
.topic{margin:0;color:var(--muted);font-size:.95rem}

/* player */
.player{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.modes[hidden]{display:none}
.modes{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.modes button{flex:1;border:0;background:transparent;font-size:.85rem;padding:8px 2px;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.play-row{display:flex;align-items:center;gap:14px}
.play{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--season);color:var(--on-season);cursor:pointer;display:grid;place-items:center}
.play svg{width:26px;height:26px;fill:currentColor}
.track{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.track strong{font-size:.95rem;line-height:1.4}
.bar-wrap{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;cursor:pointer}
.bar-fill{height:100%;width:0;background:var(--season)}
.time{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.voices{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.voices button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer}
.voices button[aria-pressed="true"]{border-color:var(--season);color:var(--season);font-weight:700}

/* text */
.text p{margin:0;font-size:1.02rem;line-height:1.95}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0 0;font-size:.88rem}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0}
.draft{margin-top:14px;font-size:.78rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}


/* things to see: category toggles > item toggles */
.see-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.see-h span{font-size:.78rem;color:var(--muted)}
.groups{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.group{border-bottom:1px solid var(--line)}
.group>summary,.item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.group>summary::-webkit-details-marker,.item>summary::-webkit-details-marker{display:none}
.group>summary{padding:13px 2px;font-weight:700;font-size:1rem}
.group>summary .n{margin-left:auto;font-size:.78rem;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details[open]>summary .chev{transform:rotate(45deg)}
.group>summary:focus-visible,.item>summary:focus-visible{outline:2px solid var(--season);outline-offset:2px;border-radius:6px}
.items{display:flex;flex-direction:column;gap:8px;padding:0 0 14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.item>summary{padding:11px 12px;min-width:0}
.item>summary .nm{font-weight:700;min-width:0}
.item>summary .num{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font-size:.72rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.item>summary .now{flex:none;font-size:.7rem;font-weight:700;color:var(--on-season);background:var(--season);border-radius:999px;padding:1px 8px}
.item>summary .chev{margin-left:auto}
.item-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:.92rem;line-height:1.85}
.item-body p{margin:0}
.item-body .when{font-size:.84rem;color:var(--muted)}
.item-body .when b{color:var(--ink);font-weight:700}
.item-body .caution{font-size:.84rem;border-left:3px solid var(--season);padding-left:10px}
.item-body .src{font-size:.75rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.item-body .src .st{border:1px solid var(--line);border-radius:999px;padding:0 8px}
.item-body .more{font-size:.84rem;color:var(--season);font-weight:700}
.see-empty{font-size:.88rem;color:var(--muted);margin:0}

/* survey: answered by tapping on the page, sent to a Google Form */
.survey{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .3s}
.survey[hidden]{display:none}
.survey.nudge{box-shadow:0 0 0 3px var(--season)}
.sv-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sv-head h2{font-size:1.1rem}
.sv-head span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sv-note{margin:0;font-size:.75rem;color:var(--muted)}
.sv-q{margin:0;font-weight:700;font-size:1rem;line-height:1.5}
.sv-faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sv-faces button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted)}
.sv-faces button b{font-size:1.7rem;line-height:1;font-weight:400}
.sv-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sv-opts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 8px;font-size:.88rem;cursor:pointer;text-align:center;line-height:1.35}
.sv-faces button[aria-pressed="true"],.sv-opts button[aria-pressed="true"]{border-color:var(--season);background:color-mix(in srgb,var(--season) 14%,var(--bg));color:var(--ink);font-weight:700}
.sv-text{width:100%;min-height:72px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.92rem;background:var(--bg);color:var(--ink);resize:vertical}
.sv-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sv-nav .skip{border:0;background:none;color:var(--muted);font-size:.8rem;cursor:pointer;padding:6px 0;text-decoration:underline}
.sv-nav .go{border:0;background:var(--season);color:var(--on-season);border-radius:999px;padding:9px 18px;font-weight:700;font-size:.9rem;cursor:pointer}
.sv-done{margin:0;font-size:.92rem}

/* other places */
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
h2{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0}
.section-h span{font-size:.78rem;color:var(--muted)}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;padding-block:2px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.card{flex:0 0 72%;max-width:280px;scroll-snap-align:start;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .thumb{position:relative;aspect-ratio:16/10;background:var(--sunk)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .thumb .ph b{font-size:2.4rem}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card .body strong{font-family:var(--display);font-size:1.05rem;line-height:1.35}
.card .body small{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--season)}

/* map */
.map-tools{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#map{height:360px;max-width:100%;border-radius:14px;border:1px solid var(--line);z-index:0}
.leaflet-container{font-family:var(--body);background:var(--sunk)}
.pin{width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.here{width:26px;height:26px;border-color:var(--season);background:var(--season)}
.vp{width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--season);color:var(--ink);font:700 11px/20px var(--body);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.vp.on{background:var(--season);color:var(--on-season)}
.me{width:16px;height:16px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.item-body .tomap{align-self:flex-start;border:1px solid var(--season);background:transparent;color:var(--season);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700;cursor:pointer}
.legend{font-size:.78rem;color:var(--muted);margin-top:8px;display:flex;flex-direction:column;gap:4px}
.unplaced{font-size:.82rem;color:var(--muted);margin-top:6px}

/* paging + footer */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;background:var(--surface);min-width:0}
.pager a.next{text-align:right;border-color:var(--season)}
.pager small{font-size:.72rem;color:var(--muted)} .pager strong{font-family:var(--display);font-size:.98rem;line-height:1.35}
.foot{font-size:.74rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-season="autumn">
<div class="page">
  <header class="bar">
    <span class="brand" data-t="brand">層雲峡 場所ガイド</span>
    <nav><span id="count">– / –</span>
      <div class="lang" role="group" aria-label="言語 / Language" id="langs"><button data-l="ja" lang="ja">日本語</button><button data-l="en" lang="en" aria-label="English">EN</button></div>
      <a class="iconbtn" href="#map-section" id="toMap" data-t="map">マップ</a></nav>
  </header>

  <section class="hero" id="hero">
    <div class="photo" id="photo"></div>
    <div class="seasons" role="group" id="seasons">
      <button data-s="spring"></button><button data-s="summer"></button><button data-s="autumn"></button><button data-s="winter"></button>
    </div>
  </section>

  <section>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title">読み込み中</h1>
    <p class="topic" id="topic"></p>
  </section>

  <section class="player" id="player">
    <div class="modes" role="group" id="modes">
      <button data-m="core"></button><button data-m="kids"></button>
    </div>
    <div class="play-row">
      <button class="play" id="play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <div class="track">
        <strong id="trackTitle"></strong>
        <div class="bar-wrap" id="seek" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="bar-fill" id="fill"></div></div>
        <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      </div>
    </div>
    <div class="voices" id="voices"></div>
  </section>

  <section class="text" id="textSection">
    <p id="body"></p>
    <dl class="facts" id="facts"></dl>
    <div class="draft" data-t="draft"></div>
  </section>

  <section class="survey" id="survey" aria-labelledby="svH">
    <div class="sv-head"><h2 id="svH" data-t="svH"></h2><span id="svStep"></span></div>
    <p class="sv-note" id="svNote"></p>
    <div id="svBody"></div>
  </section>

  <section id="see-section">
    <div class="see-h"><h2 data-t="seeH"></h2><span id="seeCount"></span></div>
    <div class="groups" id="groups"></div>
  </section>

  <section id="others">
    <div class="section-h"><h2 data-t="othersH"></h2><span data-t="swipe"></span></div>
    <div class="strip" id="strip"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </section>

  <section id="map-section">
    <div class="section-h"><h2 data-t="mapH"></h2><span data-t="mapSub"></span></div>
    <div class="map-tools">
      <div class="chips" role="group" id="bases">
        <button data-b="pale" aria-pressed="true"></button>
        <button data-b="photo" aria-pressed="false"></button>
        <button data-b="relief" aria-pressed="false"></button>
        <button data-b="geo" aria-pressed="false"></button>
      </div>
      <div class="chips" role="group" id="cats"></div>
      <div class="chips"><button id="locate" aria-pressed="false"></button></div>
    </div>
    <div id="map"></div>
    <div class="legend" id="legend"></div>
    <div class="unplaced" id="unplaced"></div>
  </section>

  <nav class="pager" id="pager"></nav>

  <footer class="foot">
    <span id="credit"></span>
    <span data-t="footInfo"></span>
    <span data-t="footMap"></span>
    <span data-t="footTest"></span>
  </footer>
</div>
<audio id="audio" preload="metadata" playsinline></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* Everything on the page follows one language: text, audio, map labels and the things-to-see list.
   Data text comes from guide.json (Japanese fields, and the same field with _en for English). */
const T={
 ja:{brand:"層雲峡 場所ガイド",map:"マップ",loading:"読み込み中",photo:"写真",seasonsLabel:"季節",seasons:{spring:"春",summer:"夏",autumn:"秋",winter:"冬"},
  photoSoon:s=>`${s}の写真を準備中`,photoAlt:(p,s)=>`${p}の${s}`,
  player:"音声ガイド",modesLabel:"解説の種類",modes:{core:"おとな向け",kids:"子ども向け"},track:{core:"音声ガイド",kids:"音声ガイド（子ども向け）",en:"音声ガイド"},
  play:"音声ガイドを再生",pause:"一時停止",seek:"再生位置",voice:"声",text:"解説",
  facts:{season:"行ける時期",access:"行き方"},
  draft:"解説は層雲峡ナレッジマップで裏取りした事実だけで書いた下書きです。館長の確認前です。",
  seeH:"ここで見られるもの",seeCount:n=>`${n}件 ・ 開くと説明が出ます`,seeEmpty:"この場所の見どころは、まだ登録されていません。",
  mapNo:"散策マップの番号",nowSeason:s=>`${s}に見られる`,allYear:"一年中見られる",when:"見られる時期",flowerLink:"写真を見る（ビジターセンター 花図鑑）",src:"出典：",sep:"、",
  othersH:"他の場所はこちら",swipe:"横にスライド",audioLen:t=>` ・ 音声 ${t}`,
  mapH:"マップで見る",mapSub:"地形や岩の分布を重ねられます",bases:{pale:"地図",photo:"航空写真",relief:"地形の陰影",geo:"地質図（岩の種類）"},basesLabel:"地図の種類",catsLabel:"表示する場所",allPlaces:"すべての場所",
  legendPins:l=>l.length?`●は場所の位置です。${l.join("、")}は地図サービス上の位置で、現地ではまだ測っていません。`:"●は場所の位置です（現地で測った位置）。",
  legendVp:"番号の丸は散策路の見どころです（現地で測った位置。番号はビジターセンターの散策マップと同じ）。",
  locate:"現在地を表示",locateOn:"現在地を表示中",locateErr:"現在地を取得できませんでした。位置情報の利用を許可してください。",toMap:"地図で見る",
  legendGeo:`地質図の色の意味は <a href="https://gbank.gsj.jp/seamless/legend.html" target="_blank" rel="noopener">凡例（産総研）</a> で確認できます。地質図は縮尺20万分の1なので、細かい位置は合いません。`,

function photoHTML(p,s,big){

  return `<div class="ph"><b>${S}</b>${big?`<span>${t().photoSoon(S)}</span>`:""}</div>`;
}
function renderPhoto(){
  document.body.dataset.season=season; press($("seasons"),"s",season);

  renderStrip(); renderSee();
}

function track(){return cur.audio[audioKey()]}
function renderPlayer(){
  press($("modes"),"m",jaMode);
  const tr=track(); audio.pause(); audio.src=tr?tr.src:""; setIcon(false);
  $("fill").style.width="0"; $("cur").textContent="0:00"; $("dur").textContent=tr?fmt(tr.seconds):"0:00";

  $("body").textContent=lang==="en"?cur.en:cur[jaMode];
}
function setIcon(playing){$("playIcon").innerHTML=playing?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';

function renderText(){

/* In-season check always reads the Japanese "見られる時期", which is the checked original */
function inSeason(when,s){if(!when)return false;if(when.includes(T.ja.seasons[s])||when.includes("一年中"))return true;
  return (when.match(/(\d+)月/g)||[]).map(x=>parseInt(x)).some(m=>SEASON_MONTHS[s].includes(m))}
function renderSee(){
  const hl=cur.highlights||[], g=$("groups"), L=t();
  $("seeCount").textContent=hl.length?L.seeCount(hl.length):"";
  if(!hl.length){g.innerHTML=`<p class="see-empty">${L.seeEmpty}</p>`;return}
  const cats=[...new Set(hl.map(x=>x.category))];
  g.innerHTML=cats.map((c,i)=>{const list=hl.filter(x=>x.category===c);
    return `<details class="group"${i===0?" open":""}><summary><span class="chev"></span>${esc(lab(c))}<span class="n">${list.length}</span></summary><div class="items">`+
    list.map(x=>{const now=inSeason(x.when,season), when=tx(x,"when"), note=tx(x,"note");
      const badge=now?`<span class="now">${(x.when||"").includes("一年中")?L.allYear:L.nowSeason(L.seasons[season])}</span>`:"";
      const srcs=(x.sources||[]).map(s=>{const n=tx(s,"name");return s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(n)}</a>`:esc(n)}).join(L.sep);
      return `<details class="item" data-i="${hl.indexOf(x)}"><summary>${x.map_number?`<span class="num" title="${L.mapNo}">${x.map_number}</span>`:""}<span class="nm">${esc(tx(x,"name"))}</span>${badge}<span class="chev"></span></summary>
      <div class="item-body"><p>${esc(tx(x,"description"))}</p>${when?`<div class="when"><b>${L.when}</b>　${esc(when)}</div>`:""}${note?`<div class="caution">${esc(note)}</div>`:""}${x.link?`<a class="more" href="${esc(x.link)}" target="_blank" rel="noopener">${L.flowerLink}</a>`:""}${x.lat!=null?`<button class="tomap" data-act="tomap" data-i="${hl.indexOf(x)}">${L.toMap}</button>`:""}
      <div class="src"><span class="st">${esc(lab(x.status))}</span><span>${L.src}${srcs}</span></div></div></details>`}).join("")+`</div></details>`}).join("");
}

function renderStrip(){
  const others=guide.points.filter(p=>p.id!==cur.id);
  $("strip").innerHTML=others.map(p=>{const tr=p.audio[audioKey()];
    return `<a class="card" href="#${p.id}"><div class="thumb">${photoHTML(p,season,false)}</div><div class="body"><strong>${esc(placeName(p))}</strong><small>${esc(lab(p.category))}${tr?t().audioLen(fmt(tr.seconds)):""}</small></div></a>`}).join("");
  $("dots").innerHTML=others.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("");
  $("strip").scrollLeft=0;
}
function stripStep(){
  const s=$("strip"), cards=[...s.children]; if(!cards.length)return;
  const w=cards[0].getBoundingClientRect().width+12, i=Math.round(s.scrollLeft/w);
  const next=(i+1)>=cards.length||s.scrollLeft+s.clientWidth>=s.scrollWidth-4?0:i+1;
  s.scrollTo({left:next*w,behavior:"smooth"});
}
$("strip").addEventListener("scroll",()=>{const s=$("strip"),c=s.children[0];if(!c)return;
  const i=Math.round(s.scrollLeft/(c.getBoundingClientRect().width+12));[...$("dots").children].forEach((d,j)=>d.classList.toggle("on",j===i))},{passive:true});
["pointerdown","wheel","touchstart"].forEach(ev=>$("strip").addEventListener(ev,()=>{touched=true},{passive:true}));
function startStrip(){clearInterval(stripTimer);if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  stripTimer=setInterval(()=>{if(!touched&&!document.hidden)stripStep()},4500)}

function initMap(){
  if(!window.L){$("legend").textContent=t().noMap;return}
  map=L.map("map",{scrollWheelZoom:false,zoomControl:true,attributionControl:true}).setView([43.715,142.98],12);
  map.attributionControl.setPrefix(false);
  const gsi="<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル / GSI</a>";
  const bases={
    pale:L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",{maxZoom:18,attribution:gsi}),
    photo:L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg",{maxZoom:18,attribution:gsi}),
    relief:L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/hillshademap/{z}/{x}/{y}.png",{maxZoom:16,attribution:gsi}),
  };
  geoLayer=L.tileLayer("https://gbank.gsj.jp/seamless/v2/api/1.2/tiles/{z}/{y}/{x}.png",{maxZoom:13,maxNativeZoom:13,opacity:.7,
    attribution:"<a href='https://gbank.gsj.jp/seamless/' target='_blank'>産総研 シームレス地質図V2 / AIST</a>"});
  baseLayer=bases.pale.addTo(map);

  $("bases").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.b==="geo"){const on=map.hasLayer(geoLayer);on?map.removeLayer(geoLayer):geoLayer.addTo(map);b.setAttribute("aria-pressed",String(!on));renderLegend();return}
    map.removeLayer(baseLayer);baseLayer=bases[b.dataset.b].addTo(map);if(map.hasLayer(geoLayer))geoLayer.bringToFront();
    $("bases").querySelectorAll("button:not([data-b=geo])").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});
  $("cats").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;met.mapUsed=true;cat=b.dataset.c;press($("cats"),"c",cat);drawMarkers()});
}
function renderCats(){
  const cats=["all",...new Set(guide.points.map(p=>p.category).filter(Boolean))];

}
function renderLegend(){
  const unmeasured=guide.points.filter(p=>p.location&&p.location.lat!=null&&!p.location.measured).map(placeName);
  $("legend").innerHTML=`<span>${t().legendPins(unmeasured)}</span>`+(Object.keys(vpMarkers).length?`<span>${t().legendVp}</span>`:"")+(map&&map.hasLayer(geoLayer)?`<span>${t().legendGeo}</span>`:"");
}
function drawMarkers(){
  if(!map)return;Object.values(markers).forEach(mk=>mk.remove());markers={};
  const shown=guide.points.filter(p=>cat==="all"||p.category===cat), placed=[], missing=[];
  shown.forEach(p=>{const L0=p.location||{};
    if(L0.lat==null||L0.lng==null){missing.push(p);return}
    const here=p.id===cur.id;
    const mk=L.marker([L0.lat,L0.lng],{icon:L.divIcon({className:"",html:`<div class="pin${here?" here":""}"></div>`,iconSize:here?[26,26]:[18,18]}),zIndexOffset:here?1000:0,title:placeName(p)})
      .addTo(map).bindTooltip(esc(placeName(p)),{direction:"top",offset:[0,-10],permanent:here});
    mk.on("click",()=>{location.hash=p.id});markers[p.id]=mk;placed.push([L0.lat,L0.lng])});
  /* things to see on this place's own trail, as numbered circles */
  Object.values(vpMarkers).forEach(mk=>mk.remove());vpMarkers={};
  const here=cur.location||{}, near=[];
  (cur.highlights||[]).forEach((x,i)=>{if(x.lat==null)return;
    const label=x.map_number||"•";
    vpMarkers[i]=L.marker([x.lat,x.lng],{icon:L.divIcon({className:"",html:`<div class="vp">${label}</div>`,iconSize:[24,24]}),title:tx(x,"name"),zIndexOffset:500})
      .addTo(map).bindTooltip(esc(tx(x,"name")),{direction:"top",offset:[0,-12]});
    vpMarkers[i].on("click",()=>openItem(i));near.push([x.lat,x.lng])});
  if(near.length&&here.lat!=null)map.fitBounds([...near,[here.lat,here.lng]],{padding:[30,30],maxZoom:17});
  else if(placed.length>1)map.fitBounds(placed,{padding:[40,40],maxZoom:14});else if(placed.length===1)map.setView(placed[0],14);
  renderLegend();
  $("unplaced").textContent=missing.length?t().unplaced(missing.map(placeName).join(t().sep)):"";
}

function openItem(i){
  const it=[...document.querySelectorAll("#groups details.item")].find(d=>d.dataset.i===String(i)); if(!it)return;
  it.closest("details.group").open=true; it.open=true; it.scrollIntoView({behavior:"smooth",block:"center"});
}
function showOnMap(i){
  const mk=vpMarkers[i]; if(!mk)return;
  $("map-section").scrollIntoView({behavior:"smooth"}); map.setView(mk.getLatLng(),17); mk.openTooltip();
  Object.values(vpMarkers).forEach(m=>m.getElement()&&m.getElement().firstChild.classList.remove("on"));
  mk.getElement()&&mk.getElement().firstChild.classList.add("on");
}
function toggleLocate(){
  const b=$("locate");
  if(meWatch!=null){navigator.geolocation.clearWatch(meWatch);meWatch=null;meMarker&&meMarker.remove();meCircle&&meCircle.remove();meMarker=meCircle=null;
    b.setAttribute("aria-pressed","false");b.textContent=t().locate;return}
  if(!navigator.geolocation||!map){$("unplaced").textContent=t().locateErr;return}
  b.setAttribute("aria-pressed","true");b.textContent=t().locateOn;meFirst=true;
  meWatch=navigator.geolocation.watchPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    if(!meMarker){meMarker=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16]}),zIndexOffset:2000,interactive:false}).addTo(map);
      meCircle=L.circle(ll,{radius:pos.coords.accuracy,color:"#1f6fe5",weight:1,fillOpacity:.08,interactive:false}).addTo(map)}
    else{meMarker.setLatLng(ll);meCircle.setLatLng(ll).setRadius(pos.coords.accuracy)}
    if(meFirst){map.setView(ll,Math.max(map.getZoom(),16));meFirst=false}
  },()=>{$("unplaced").textContent=t().locateErr;toggleLocate()},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
$("locate").addEventListener("click",toggleLocate);

function renderPager(){
  const i=guide.points.findIndex(p=>p.id===cur.id), n=guide.points.length;

}

function show(id,keepScroll){

function setLang(l){

}

  "聞きたい話":"entry.262425486","キャラ":"entry.1656007330","払える金額":"entry.1879801806","ひとこと":"entry.2048451290"}};
const SV_Q=[
  {k:"満足度",type:"face",ja:"この音声ガイド、どうでしたか？",en:"How was this audio guide?",
   opts:[["5","😆","最高","Loved it"],["4","🙂","よい","Good"],["3","😐","ふつう","OK"],["2","🙁","いまいち","Not great"],["1","😣","よくない","Poor"]]},
  {k:"どこから",type:"one",ja:"どこから来ましたか？",en:"Where are you visiting from?",
   opts:[["北海道内","北海道内","Hokkaido"],["道外","北海道の外（国内）","Elsewhere in Japan"],["海外","海外","Outside Japan"]]},
  {k:"国・地域",type:"one",show:a=>a["どこから"]==="海外",ja:"どちらの国・地域からですか？",en:"Which country or region?",
   opts:[["台湾","台湾","Taiwan"],["中国","中国","China"],["香港","香港","Hong Kong"],["韓国","韓国","Korea"],["タイ","タイ","Thailand"],["シンガポール","シンガポール","Singapore"],["マレーシア","マレーシア","Malaysia"],["アメリカ","アメリカ","USA"],["オーストラリア","オーストラリア","Australia"],["その他","その他","Other"]]},
  {k:"誰と",type:"one",ja:"だれと来ましたか？",en:"Who are you with?",
   opts:[["ひとり","ひとり","On my own"],["家族","家族","Family"],["友人・恋人","友人・恋人","Friends / partner"],["ツアー・団体","ツアー・団体","Tour / group"]]},
  {k:"聞きたい話",type:"multi",ja:"もっと聞きたい話は？（いくつでも）",en:"What would you like to hear more about? (choose any)",
   opts:[["岩・地形","岩・地形","Rocks & landforms"],["植物","植物","Plants"],["動物","動物","Animals"],["名前の由来・歴史","名前の由来・歴史","Place names & history"],["アイヌ文化","アイヌ文化","Ainu culture"],["地元の小ネタ・怪談","地元の小ネタ・怪談","Local stories & ghost tales"]]},
  {k:"キャラ",type:"one",ja:"案内役のキャラクターがいるなら？",en:"If a character guided you, what kind?",
   opts:[["かわいい系","かわいい系","Cute"],["ちょっと変でおもしろい系","ちょっと変で\nおもしろい系","Quirky & funny"],["いらない","いらない","No character"]]},
  {k:"払える金額",type:"one",ja:"全部の場所を聞けるガイドが有料なら、いくらまで払えますか？",en:"If a guide covering every spot cost money, how much would you pay?",
   opts:[["無料なら使う","無料なら使う","Only if free"],["100円","100円","¥100"],["300円","300円","¥300"],["500円以上","500円以上","¥500 or more"]]},
  {k:"ひとこと",type:"text",ja:"ひとこと（なくても大丈夫です）",en:"Anything else? (optional)"}
];
let sv=store.get("survey",null), svJustDone=false;
if(!sv||!sv.id) sv={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),step:0,a:{},done:false,sentAt:0};
const met={listen:{},opened:new Set(),mapUsed:false};
const svQs=()=>SV_Q.filter(q=>!q.show||q.show(sv.a));
function svSave(){store.set("survey",sv)}
function svPayload(){
  const lp=cur?Math.round((met.listen[cur.id]||0)*100):0;
  const auto={"回答ID":sv.id,"場所":cur?cur.id:"","言語":lang==="en"?"英語":"日本語・"+(jaMode==="kids"?"子ども向け":"おとな向け"),
    "音声":lp>=95?"最後まで":lp>0?lp+"%":"聞いていない",
    "見たもの":[met.opened.size?`見どころ${met.opened.size}件を開いた`:"",met.mapUsed?"地図を操作":""].filter(Boolean).join("、")||"なし"};
  const ans={}; Object.entries(sv.a).forEach(([k,v])=>ans[k]=Array.isArray(v)?v.join("、"):v);
  return {...auto,...ans};
}
function svSend(){
  const data=svPayload(), body=new URLSearchParams();
  Object.entries(data).forEach(([k,v])=>{const id=SURVEY.entries[k];if(id&&v!=="")body.append(id,v)});
  sv.sentAt=Date.now(); svSave();
  if(!SURVEY.form){console.log("[survey] (form not set)",data);return}
  const url=SURVEY.form.replace(/\/viewform.*$/,"/formResponse");
  if(!(navigator.sendBeacon&&navigator.sendBeacon(url,body)))fetch(url,{method:"POST",mode:"no-cors",body}).catch(()=>{});
}
function renderSurvey(){
  const box=$("svBody"), L=t(), qs=svQs();
  $("survey").hidden=sv.done&&!svJustDone;
  $("svNote").textContent=sv.done?"":L.svNote;
  if(sv.done){$("svStep").textContent="";box.innerHTML=`<p class="sv-done">${L.svDone}</p>`;return}
  if(sv.step>=qs.length)sv.step=qs.length-1;
  const q=qs[sv.step], val=sv.a[q.k], lab=o=>lang==="en"?o[o.length-1]:o[o.length-2];
  $("svStep").textContent=`${sv.step+1} / ${qs.length}`;
  let h=`<p class="sv-q">${esc(q[lang])}</p>`;
  if(q.type==="face")h+=`<div class="sv-faces" role="group" aria-label="${esc(q[lang])}">`+q.opts.map(o=>`<button data-v="${o[0]}" aria-pressed="${val===o[0]}"><b aria-hidden="true">${o[1]}</b>${esc(lab(o))}</button>`).join("")+`</div>`;
  if(q.type==="one"||q.type==="multi")h+=`<div class="sv-opts" role="group" aria-label="${esc(q[lang])}">`+q.opts.map(o=>{const on=q.type==="multi"?(val||[]).includes(o[0]):val===o[0];
    return `<button data-v="${esc(o[0])}" aria-pressed="${on}">${esc(lab(o)).replace(/\n/g,"<br>")}</button>`}).join("")+`</div>`;
  if(q.type==="text")h+=`<textarea class="sv-text" id="svText" aria-label="${esc(q[lang])}">${esc(val||"")}</textarea>`;
  const last=sv.step===qs.length-1, needGo=q.type==="multi"||q.type==="text";
  h+=`<div class="sv-nav"><button class="skip" data-act="skip">${L.svSkip}</button>${needGo?`<button class="go" data-act="next">${last?L.svSend:L.svNext}</button>`:""}</div>`;
  box.innerHTML=h;
}
function svAdvance(){
  const qs=svQs();
  if(sv.step>=qs.length-1){sv.done=true;svJustDone=true;svSend()}else sv.step++;
  svSave(); renderSurvey();
}
$("svBody").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return; const q=svQs()[sv.step];
  if(b.dataset.act==="skip"){if(q.type==="text")sv.a[q.k]=$("svText").value.trim();svAdvance();return}
  if(b.dataset.act==="next"){if(q.type==="text"){const v=$("svText").value.trim();if(v)sv.a[q.k]=v}svAdvance();return}
  if(q.type==="multi"){const cur=new Set(sv.a[q.k]||[]);cur.has(b.dataset.v)?cur.delete(b.dataset.v):cur.add(b.dataset.v);sv.a[q.k]=[...cur];svSave();renderSurvey();return}
  sv.a[q.k]=b.dataset.v; svSave(); renderSurvey(); setTimeout(svAdvance,220);   // single choice: tap = answer and move on
});
$("svBody").addEventListener("input",e=>{if(e.target.id==="svText"){sv.a["ひとこと"]=e.target.value;svSave()}});
/* If someone leaves halfway, send what they answered so far (same 回答ID; keep the last row per ID when counting) */
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&!sv.done&&Object.keys(sv.a).length)svSend()});
$("groups").addEventListener("click",e=>{const b=e.target.closest("button[data-act=tomap]");if(b)showOnMap(+b.dataset.i)});
$("groups").addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("item")&&e.target.open)met.opened.add(e.target.querySelector(".nm").textContent)},true);

$("langs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setLang(b.dataset.l)});
$("seasons").addEventListener("click",e=>{const b=e.target.closest("button");if(b){season=b.dataset.s;renderPhoto()}});
$("modes").addEventListener("click",e=>{const b=e.target.closest("button");if(b){jaMode=b.dataset.m;store.set("jaMode",jaMode);renderPlayer();renderStrip()}});
$("voices").addEventListener("click",e=>{const b=e.target.closest("button");if(b){voice[lang]=b.dataset.v;store.set("voice",voice);renderPlayer();renderStrip()}});
$("play").addEventListener("click",()=>{if(!audio.src)return;if(audio.paused){audio.play().catch(()=>setIcon(false))}else audio.pause()});
audio.addEventListener("play",()=>setIcon(true)); audio.addEventListener("pause",()=>setIcon(false));
audio.addEventListener("ended",()=>{setIcon(false);$("fill").style.width="100%";if(cur)met.listen[cur.id]=1;
  if(!sv.done){const s=$("survey");s.classList.add("nudge");setTimeout(()=>s.classList.remove("nudge"),2400)}});
audio.addEventListener("loadedmetadata",()=>{$("dur").textContent=fmt(audio.duration)});
audio.addEventListener("timeupdate",()=>{const r=audio.duration?audio.currentTime/audio.duration:0;if(cur)met.listen[cur.id]=Math.max(met.listen[cur.id]||0,r);
  $("fill").style.width=(r*100)+"%";$("cur").textContent=fmt(audio.currentTime);$("seek").setAttribute("aria-valuenow",String(Math.round(r*100)))});
$("seek").addEventListener("click",e=>{if(!audio.duration)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration});
$("seek").addEventListener("keydown",e=>{if(!audio.duration)return;if(e.key==="ArrowRight")audio.currentTime+=5;if(e.key==="ArrowLeft")audio.currentTime-=5});
$("toMap").addEventListener("click",e=>{e.preventDefault();$("map-section").scrollIntoView({behavior:"smooth"})});
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(guide&&guide.points.some(p=>p.id===id))show(id)});

store.set("lang",lang); renderChrome(); $("title").textContent=t().loading;
fetch("guide.json",{cache:"no-store"}).then(r=>r.json()).then(g=>{
  guide=g; renderChrome(); initMap(); renderCats(); show(location.hash.slice(1)); startStrip();
}).catch(()=>{$("title").textContent=t().failTitle;$("topic").textContent=t().failBody});
</script>
</body>
</html>
